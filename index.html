<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy Bird - Firestore Leaderboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="overlay" class="overlay hidden">
    <div id="usernameScreen" class="screen active">
      <h1>Flappy Bird</h1>
      <p>Masukkan username untuk memulai:</p>
      <input type="text" id="usernameInput" maxlength="20" placeholder="Username">
      <button id="startBtn" disabled>Mulai</button>
      <p id="usernameError" class="error hidden">Username tidak boleh kosong.</p>
    </div>

    <div id="menuScreen" class="screen hidden">
      <h1>Flappy Bird</h1>
      <div class="user-info">Halo, <span id="menuUsername"></span></div>
      <button id="playBtn">Mainkan</button>
      <button id="leaderboardBtn">Leaderboard</button>
      <div class="best-score">Highscore: <span id="menuBestScore">0</span></div>
    </div>

    <div id="leaderboardScreen" class="screen hidden">
      <h1>Leaderboard Top 10</h1>
      <div id="leaderboardList">Memuat...</div>
      <button id="backToMenuBtn">Kembali</button>
    </div>

    <div id="gameOverScreen" class="screen hidden">
      <h1>Game Over</h1>
      <div class="final-score">Skor Anda: <span id="finalScore">0</span></div>
      <div class="best-score">Highscore: <span id="gameOverBestScore">0</span></div>
      <div id="saveStatus" class="status hidden"></div>
      <button id="playAgainBtn">Main Lagi</button>
      <button id="menuBtn">Menu Utama</button>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div id="scoreDisplay">0</div>
  </div>

  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/leaderboard.js"></script>
  <script type="module" src="js/game.js"></script>
  <script type="module" src="js/ui.js"></script>
</body>
</html>
